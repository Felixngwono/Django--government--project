{% extends 'header.html' %}
{% block content %}
<div class="container mx-auto px-4 py-6">
    <h1 class="text-2xl font-semibold text-gray-800">Project Locations</h1>
    <table class="min-w-full bg-white border border-gray-300 mt-4">
        <thead>
            <tr class="bg-gray-800 text-white">
                <th class="py-2 px-4 border">Name</th>
                <th class="py-2 px-4 border">Coordinates</th>
                <th class="py-2 px-4 border">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for location in locations %}
            <tr class="border text-gray-700">
                <td class="py-2 px-4 border">{{ location.name }}</td>
                <td class="py-2 px-4 border">{{ location.latitude }}, {{ location.longitude }}</td>
                <td class="py-2 px-4 border">
                    <a href="{% url 'project_location_detail' location.id %}" class="text-blue-500 hover:underline">View</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" class="text-center py-4">No locations added yet</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
