{% extends 'header.html' %}
{% block content %}
{% include "sidebar.html" %}
<script src="https://cdn.tailwindcss.com"></script>

<div class="ml-64 w-[calc(100%-16rem)] min-h-screen bg-gray-100 p-8 flex justify-center items-center">
    <div class="bg-white shadow-md rounded-lg p-6 w-full max-w-2xl">
        <h2 class="text-2xl font-semibold text-gray-800 text-center mb-4">Add Milestone</h2>
        
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="flex justify-between">
                <a href="{% url 'milestone_list' %}" class="text-gray-600 hover:text-gray-800 text-sm underline">
                    ← Back to Milestones
                </a>
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700 transition">
                    Save Milestone
                </button>
            </div>
        </form>
    </div>
</div>

{% include "footer.html" %}
{% endblock %}
