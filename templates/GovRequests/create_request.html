<div class="max-w-3xl mx-auto bg-white shadow-xl rounded-2xl p-8">

    <!-- Header -->
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
            <iconify-icon icon="solar:note-add-bold-duotone" class="text-blue-600"></iconify-icon>
            Submit Government Request
        </h2>
        <p class="text-sm text-gray-500 mt-1">
            Report an issue, request a service, or raise a concern to the government.
        </p>
    </div>

    <!-- Form -->
    <form method="POST" enctype="multipart/form-data" class="space-y-6">
        {% csrf_token %}

        <!-- Title -->
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">
                Request Title
            </label>
            <input type="text" name="title" required
                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                placeholder="e.g. Road repair needed in my area">
        </div>

        <!-- Category -->
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">
                Category
            </label>
            <select name="category"
                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <option value="">Select category</option>
                <option value="infrastructure">Infrastructure</option>
                <option value="water">Water & Sanitation</option>
                <option value="health">Health Services</option>
                <option value="education">Education</option>
                <option value="security">Security</option>
                <option value="corruption">Corruption Report</option>
                <option value="other">Other</option>
            </select>
        </div>

        <!-- Location -->
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">
                Location
            </label>
            <input type="text" name="location"
                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                placeholder="e.g. Nairobi, Westlands">
        </div>

        <!-- Description -->
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">
                Description
            </label>
            <textarea name="description" rows="4"
                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                placeholder="Describe the issue in detail..."></textarea>
        </div>

        <!-- Image Upload -->
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">
                Upload Image (Optional)
            </label>
            <input type="file" name="image"
                class="w-full px-4 py-2 border rounded-lg bg-gray-50">
        </div>

        <!-- Buttons -->
        <div class="flex items-center justify-between pt-4">
            <a href="{% url 'my_requests' %}"
               class="text-gray-600 hover:text-gray-800 text-sm">
                ← Back to My Requests
            </a>

            <button type="submit"
                class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg shadow-md transition">
                Submit Request
            </button>
        </div>

    </form>

</div>
