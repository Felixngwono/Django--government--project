{% extends "header.html " %}
 {% block content %} 
{% include "sidebar.html" %}
  
<div class="container ">
    <h1 class="text-2xl font-bold mb-4">Add Audit</h1>
    {% if messages %}
        <div class="mb-4">
            {% for message in messages %}
                <div class="bg-green-100 text-green-800 p-2 rounded mb-2">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}
    <form method="post" action="{% url 'add_audit' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Add Audit</button>
{% include "footer.html" %}
{% endblock %}
