{% load static %}
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reset Password | GovTracker</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-emerald-950 px-4 py-12 text-slate-800">
  <main class="mx-auto max-w-md rounded-3xl bg-white p-8 shadow-2xl">
    <p class="text-sm font-semibold uppercase tracking-[0.25em] text-emerald-700">GovTracker</p>
    <h1 class="mt-3 text-2xl font-bold">Reset your password</h1>
    <p class="mt-2 text-sm text-slate-500">Choose how you want to receive recovery instructions.</p>
    {% if messages %}{% for message in messages %}<p class="mt-4 rounded-xl bg-emerald-50 px-4 py-3 text-sm text-emerald-700">{{ message }}</p>{% endfor %}{% endif %}
    <form method="post" class="mt-6 space-y-4">{% csrf_token %}
      <label class="block text-sm font-semibold">Recovery method
        <select name="method" class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3" required><option value="email">Email link</option><option value="sms">SMS code</option></select>
      </label>
      <label class="block text-sm font-semibold">Email address or phone number
        <input name="identifier" class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3" placeholder="name@example.com or +254..." required>
      </label>
      <button class="w-full rounded-xl bg-emerald-700 px-4 py-3 font-semibold text-white hover:bg-emerald-800">Continue</button>
    </form>
    <a href="{% url 'login' %}" class="mt-5 block text-center text-sm font-semibold text-emerald-700">Back to sign in</a>
  </main>
</body>
</html>
