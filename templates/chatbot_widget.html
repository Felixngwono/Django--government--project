<style>
  #gov-chat-widget { position: fixed; right: 24px; bottom: 24px; z-index: 9999; font-family: Arial, sans-serif; }
  #gov-chat-toggle { width: 58px; height: 58px; border: 0; border-radius: 50%; background: #2563eb; color: #fff; cursor: pointer; box-shadow: 0 8px 24px rgba(37,99,235,.35); font-size: 24px; }
  #gov-chat-panel { display: none; position: absolute; right: 0; bottom: 72px; width: min(360px, calc(100vw - 32px)); height: 460px; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 18px 48px rgba(15,23,42,.25); border: 1px solid #dbeafe; }
  #gov-chat-panel.is-open { display: flex; flex-direction: column; }
  .gov-chat-title { padding: 16px; background: #1d4ed8; color: #fff; font-weight: 700; }
  #gov-chat-messages { flex: 1; overflow-y: auto; padding: 14px; background: #f8fafc; }
  .gov-chat-message { max-width: 85%; margin: 8px 0; padding: 10px 12px; border-radius: 12px; line-height: 1.4; font-size: 14px; white-space: pre-wrap; }
  .gov-chat-user { margin-left: auto; background: #2563eb; color: #fff; border-bottom-right-radius: 3px; }
  .gov-chat-assistant { background: #e2e8f0; color: #1e293b; border-bottom-left-radius: 3px; }
  #gov-chat-form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e2e8f0; }
  #gov-chat-input { flex: 1; min-width: 0; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; }
  #gov-chat-send { border: 0; border-radius: 8px; background: #2563eb; color: #fff; padding: 0 14px; cursor: pointer; }
  #gov-chat-send:disabled { opacity: .6; cursor: wait; }
</style>

<div id="gov-chat-widget" aria-live="polite">
  <section id="gov-chat-panel" aria-label="Government project assistant">
    <div class="gov-chat-title">GovTracker Assistant</div>
    <div id="gov-chat-messages">
      <div class="gov-chat-message gov-chat-assistant">Hello. Ask about project status, delays, budgets, or reporting an issue.</div>
    </div>
    <form id="gov-chat-form">
      {% csrf_token %}
      <input id="gov-chat-input" type="text" maxlength="3000" autocomplete="off" placeholder="Ask a question…" aria-label="Your question">
      <button id="gov-chat-send" type="submit">Send</button>
    </form>
  </section>
  <button id="gov-chat-toggle" type="button" aria-controls="gov-chat-panel" aria-expanded="false" title="Open GovTracker Assistant">💬</button>
</div>

<script>
(() => {
  const toggle = document.getElementById('gov-chat-toggle');
  const panel = document.getElementById('gov-chat-panel');
  const form = document.getElementById('gov-chat-form');
  const input = document.getElementById('gov-chat-input');
  const messages = document.getElementById('gov-chat-messages');
  const send = document.getElementById('gov-chat-send');
  if (!toggle || !panel || !form) return;

  const addMessage = (text, role) => {
    const bubble = document.createElement('div');
    bubble.className = `gov-chat-message gov-chat-${role}`;
    bubble.textContent = text;
    messages.appendChild(bubble);
    messages.scrollTop = messages.scrollHeight;
  };
  toggle.addEventListener('click', () => {
    const open = panel.classList.toggle('is-open');
    toggle.setAttribute('aria-expanded', String(open));
    if (open) input.focus();
  });
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    addMessage(message, 'user');
    input.value = '';
    send.disabled = true;
    try {
      const response = await fetch('{% url "ai_chatbot_api" %}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': form.querySelector('[name=csrfmiddlewaretoken]').value },
        credentials: 'same-origin',
        body: JSON.stringify({ message })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'The assistant could not respond.');
      addMessage(data.reply, 'assistant');
    } catch (error) {
      addMessage(error.message || 'The assistant is temporarily unavailable.', 'assistant');
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
})();
</script>
