{% extends "header.html" %}
{% block content %}
{% load static %}
{% include "sidebar.html" %}

<div class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50">

    <!-- Modal Card -->
    <div class="bg-white dark:bg-gray-800 w-full max-w-md rounded-2xl shadow-2xl p-8 text-center animate-fadeIn">

        <!-- Icon -->
        <div class="flex justify-center mb-4">
            <div class="bg-red-100 text-red-600 rounded-full p-4">
                <svg class="w-10 h-10" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd"
                        d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9z"
                        clip-rule="evenodd"></path>
                </svg>
            </div>
        </div>

        <!-- Title -->
        <h3 class="text-xl font-bold text-gray-800 dark:text-white mb-2">
            Confirm Deletion
        </h3>

        <!-- Message -->
        <p class="text-gray-600 dark:text-gray-300 mb-6">
            Are you sure you want to delete this division?  
            This action cannot be undone.
        </p>

        <!-- Form -->
        <form method="POST">
            {% csrf_token %}

            <div class="flex justify-center space-x-4">

                <!-- Cancel -->
                <a href="{% url 'projectoverview' %}"
                   class="px-5 py-2 rounded-lg border border-gray-300 bg-white hover:bg-gray-100 text-gray-700 transition">
                   Cancel
                </a>

                <!-- Confirm Delete -->
                <button type="submit"
                        class="px-5 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white shadow-md transition">
                    Yes, Delete
                </button>

            </div>
        </form>

    </div>

</div>

<!-- Animation -->
<style>
@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}
.animate-fadeIn {
    animation: fadeIn 0.3s ease-in-out;
}
</style>

{% endblock content %}
