{% extends 'header.html' %}

{% block content %}
{% include "sidebar.html" %}
<div class="ml-64 w-[calc(100%-16rem)]">

<div class="container mx-auto px-4 py-6">
    <h1 class="text-2xl font-semibold text-gray-800">{{ title }}</h1>

    <form method="post" enctype="multipart/form-data" class="mt-4 bg-white p-6 rounded shadow-md">
        {% csrf_token %}
        {{ form.as_p }}
        
        <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
            Save
        </button>
        <a href="{% url 'tender_list' %}" class="ml-4 text-gray-500 hover:underline">Cancel</a>
    </form>
</div>
</div>
</div>
{% include "footer.html" %}
{% endblock %}
