<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Choose a new password | GovTracker</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-emerald-950 px-4 py-12"><main class="mx-auto max-w-md rounded-3xl bg-white p-8 shadow-2xl"><h1 class="text-2xl font-bold text-slate-900">Choose a new password</h1>{% if valid_link %}<form method="post" class="mt-6 space-y-4">{% csrf_token %}<input type="password" name="password" minlength="8" required class="w-full rounded-xl border border-slate-300 px-4 py-3" placeholder="New password"><input type="password" name="confirmation" minlength="8" required class="w-full rounded-xl border border-slate-300 px-4 py-3" placeholder="Confirm password">{% if error %}<p class="text-sm text-red-600">{{ error }}</p>{% endif %}<button class="w-full rounded-xl bg-emerald-700 px-4 py-3 font-semibold text-white">Save new password</button></form>{% else %}<p class="mt-3 text-sm text-red-600">This reset link is invalid or has expired.</p>{% endif %}<a href="{% url 'login' %}" class="mt-5 block text-center text-sm font-semibold text-emerald-700">Back to sign in</a></main></body></html>
