{% extends 'header.html' %}
{% block content %}
<div class="container mx-auto px-4 py-6">
    <h1 class="text-2xl font-semibold text-gray-800">Add Comment to {{ project.name }}</h1>
    <form method="post" class="mt-4 bg-white p-6 rounded-lg shadow-md">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Post Comment</button>
    </form>
</div>
{% endblock %}
