{% load static %}

<script src="https://cdn.tailwindcss.com"></script>

<!DOCTYPE html>
<html lang="id" x-data="dashboardApp()" :class="{ 'dark': darkMode }">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GovTracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="stylesheet" href="{% static 'css/dash.css' %}">

</head>
<body x-data="dashboardApp()" :class="{ 'dark': darkMode }">

<!-- MOBILE OVERLAY -->
<div class="mobile-overlay" :class="{ show: mobileSidebarOpen }" @click="mobileSidebarOpen=false"></div>

<!-- ===== SIDEBAR ===== -->
{% include "aside.html" %}
{% load widget_tweaks %}<!-- ===== HEADER ===== -->
{% include "heading.html" %}

<!-- ===== MAIN ===== -->
<main class="main" :class="{ 'sidebar-collapsed': sidebarCollapsed, 'sidebar-hidden': isMobile }">
    <div class="flex items-center justify-between gap-4">
      <div>
        <p class="text-sm font-semibold uppercase tracking-wider text-blue-700">Project Progress</p>
        <h1 class="mt-1 text-2xl font-bold">Submit Stage Report</h1>
      </div>
      <a href="{% url 'contractor_performance' %}" class="text-sm font-semibold text-blue-700 hover:underline">Back to dashboard</a>
    </div>

    <form method="post" enctype="multipart/form-data" class="mt-6 space-y-4">
      {% csrf_token %}
      {% if preselected_project %}
      <label class="block text-sm font-semibold">Project (auto-detected)</label>
      <input type="hidden" name="project" value="{{ preselected_project.id }}">
      <input value="{{ preselected_project.project_title }}" readonly class="w-full rounded-lg border border-slate-200 bg-slate-100 px-3 py-2 text-slate-600">
      {% else %}
      <label class="block text-sm font-semibold">Project <span class="text-xs font-normal text-slate-500">— you're working on multiple projects; select the one you're submitting for</span>
        <select name="project" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" required>
          <option value="">Select project</option>
          {% for project in projects %}<option value="{{ project.id }}">{{ project.project_title }}</option>{% endfor %}
        </select>
      </label>
      {% endif %}
      <label class="block text-sm font-semibold">Stage (working on / completed)
        <input name="stage_description" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" placeholder="e.g. Foundation works — completed">
      </label>
      <label class="block text-sm font-semibold">Contractor (auto-detected — you)
        <input value="{{ contractor_display_name }}" readonly class="mt-1 w-full rounded-lg border border-slate-200 bg-slate-100 px-3 py-2 text-slate-600">
      </label>
      <input name="location" required class="w-full rounded-lg border border-slate-300 px-3 py-2" placeholder="Location">
      <label class="block text-sm font-semibold">Work completed and reporting period details
        <textarea name="description" required rows="5" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" placeholder="Describe work performed, current blockers, and planned next steps"></textarea>
      </label>
      <label class="block text-sm font-semibold">Updated completion percentage
        <input type="number" name="progress_percentage" min="0" max="100" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" placeholder="0 - 100">
      </label>
      <label class="block text-sm font-semibold">Reason for delay (if applicable)
        <textarea name="delay_reason" rows="2" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" placeholder="Explain any schedule slippage"></textarea>
      </label>
      <label class="block text-sm font-semibold">Corrective actions
        <textarea name="corrective_actions" rows="2" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" placeholder="Describe proposed recovery steps"></textarea>
      </label>
      <label class="block text-sm font-semibold">Progress photos (multiple allowed)</label>
      <input type="file" name="photos" accept="image/*" multiple class="w-full rounded-lg border border-dashed border-slate-300 px-3 py-2">
      <label class="block text-sm font-semibold">Videos, inspection reports, and supporting documents (multiple allowed; max 20 MB each)</label>
      <input type="file" name="attachments" accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx" multiple class="w-full rounded-lg border border-dashed border-slate-300 px-3 py-2">
      <label class="block text-sm font-semibold">Primary inspection report (optional)
        <input type="file" name="supporting_document" accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2">
      </label>
      <button type="submit" class="w-full rounded-lg bg-blue-700 px-4 py-3 font-semibold text-white hover:bg-blue-800">Submit Stage Report</button>
    </form>
  </main>
</body>
{% include "footer.html" %}
