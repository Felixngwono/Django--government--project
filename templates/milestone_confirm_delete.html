{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delete Milestone — GovTracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="stylesheet" href="{% static 'css/dash.css' %}">

<style>
  body { padding-bottom: 270px; }
</style>

</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center px-4">

{% include "footer.html" %}

<main class="flex-1 flex items-center justify-center w-full h-full max-h-screen">
  <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-6 sm:p-8 w-full max-w-md">
    <div class="flex items-center justify-center gap-3 mb-4">
      <div class="bg-rose-100 p-2 rounded-lg">
        <iconify-icon icon="solar:trash-bold-duotone" class="text-rose-600 w-6 h-6"></iconify-icon>
      </div>
      <div>
        <h1 class="text-xl font-bold text-slate-900">Delete Milestone</h1>
        <p class="text-sm text-slate-600 mt-1">Are you sure you want to permanently delete <strong>{{ milestone.title }}</strong>?</p>
      </div>
    </div>

    <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 mb-6">
      <p class="text-sm font-medium text-slate-700 mb-1">{{ milestone.title }}</p>
      <p class="text-xs text-slate-500">From {{ milestone.project.project_title }}. This action cannot be undone.</p>
    </div>

    <form method="post" class="mt-2">
      {% csrf_token %}
      <div class="flex gap-3">
        <button type="submit" class="flex-1 bg-rose-600 text-white text-sm font-semibold px-4 py-2.5 rounded-xl hover:bg-rose-700 transition-colors focus:outline-none focus:ring-2 focus:ring-rose-500 focus:ring-offset-2">
          Yes, Delete
        </button>
        <a href="{% url 'milestone_detail' milestone.id %}" class="flex-1 bg-white text-slate-700 border border-slate-300 text-sm font-semibold px-4 py-2.5 rounded-xl hover:bg-slate-100 transition-colors text-center">
          Cancel
        </a>
      </div>
    </form>
  </div>
</main>

</body>
</html>
