<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Verify SMS code | GovTracker</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-emerald-950 px-4 py-12"><main class="mx-auto max-w-md rounded-3xl bg-white p-8 shadow-2xl"><h1 class="text-2xl font-bold text-slate-900">Verify your phone</h1><p class="mt-2 text-sm text-slate-600">Enter the six-digit code sent to your phone and choose a new password.</p>{% if error %}<p class="mt-4 rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700">{{ error }}</p>{% endif %}<form method="post" class="mt-6 space-y-4">{% csrf_token %}<input name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required class="w-full rounded-xl border border-slate-300 px-4 py-3" placeholder="6-digit code"><input type="password" name="password" minlength="8" required class="w-full rounded-xl border border-slate-300 px-4 py-3" placeholder="New password"><input type="password" name="confirmation" minlength="8" required class="w-full rounded-xl border border-slate-300 px-4 py-3" placeholder="Confirm password"><button class="w-full rounded-xl bg-emerald-700 px-4 py-3 font-semibold text-white">Reset password</button></form></main></body></html>
