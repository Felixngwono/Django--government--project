{% extends 'heading.html' %}
{% block content %}
<main class="container" style="max-width:640px;margin:3rem auto;padding:1.5rem">
  <h1>Pay by M-Pesa</h1>
  <p>Enter an amount and the M-Pesa number to receive a payment prompt.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send M-Pesa prompt</button>
  </form>
  <p><a href="{% url 'mpesa_payment_history' %}">View payment history</a></p>
</main>
{% endblock %}
