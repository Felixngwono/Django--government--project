<h1>{{ project.project_title }}</h1>
<p>{{ project.project_description }}</p>
<h2>Comments</h2>
{% for comment in comments %}
    <p>{{ comment.text }} - {{ comment.user.username }}</p>
{% endfor %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Add Comment</button>
</form>
