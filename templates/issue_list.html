{% load static %}

<script src="https://cdn.tailwindcss.com"></script>

<!DOCTYPE html>
<html lang="id" x-data="dashboardApp()" :class="{ 'dark': darkMode }">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GovTracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="stylesheet" href="{% static 'css/dash.css' %}">

</head>
<body x-data="dashboardApp()" :class="{ 'dark': darkMode }">

<!-- MOBILE OVERLAY -->
<div class="mobile-overlay" :class="{ show: mobileSidebarOpen }" @click="mobileSidebarOpen=false"></div>

<!-- ===== SIDEBAR ===== -->
{% include "aside.html" %}

<!-- ===== HEADER ===== -->
{% include "heading.html" %}

<!-- ===== MAIN ===== -->
<main class="main" :class="{ 'sidebar-collapsed': sidebarCollapsed, 'sidebar-hidden': isMobile }">
  <div class="content">

    <!-- ============================
         PAGE: DASHBOARD
    ============================= -->




<!-- TailwindCSS CDN -->
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <div class="container px-4 py-6">
    <h1 class="text-2xl font-semibold text-gray-800">Reported Issues</h1>
    <table class="min-w-full bg-white border border-gray-300 mt-4">
        <thead>
            <tr class="bg-gray-800 text-white">
                <th class="py-2 px-4 border">Title</th>
                <th class="py-2 px-4 border">Status</th>
                <th class="py-2 px-4 border">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for issue in issues %}
            <tr class="border text-gray-700">
                <td class="py-2 px-4 border">{{ issue.title }}</td>
                <td class="py-2 px-4 border">{{ issue.status }}</td>
                <td class="py-2 px-4 border">
                    <a href="{% url 'issue_detail' issue.id %}" class="text-blue-500 hover:underline">View</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" class="text-center py-4">No issues reported</td>
            </tr>
            {% endfor %}
        </tbody>
        <div class="mt-4">
            <a href="{% url 'add_report_issue' %}" class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded shadow">
                Add Report
            </a>
        </div>
        
    </table>
</div>

</div>
</div>
</main>
{% include "footer.html" %}
