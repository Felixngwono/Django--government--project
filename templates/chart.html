{% load static %}

<script src="https://cdn.tailwindcss.com"></script>

<!DOCTYPE html>
<html lang="id" x-data="dashboardApp()" :class="{ 'dark': darkMode }">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GovTracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="stylesheet" href="{% static 'css/dash.css' %}">

</head>
<body x-data="dashboardApp()" :class="{ 'dark': darkMode }">

<!-- MOBILE OVERLAY -->
<div class="mobile-overlay" :class="{ show: mobileSidebarOpen }" @click="mobileSidebarOpen=false"></div>

<!-- ===== SIDEBAR ===== -->
{% include "aside.html" %}

<!-- ===== HEADER ===== -->
{% include "heading.html" %}

<!-- ===== MAIN ===== -->
<main class="main" :class="{ 'sidebar-collapsed': sidebarCollapsed, 'sidebar-hidden': isMobile }">
  <div class="content">

    <!-- ============================
         PAGE: DASHBOARD
    ============================= -->
    <div class="page-section" :class="{ active: currentPage==='chart' }">


<div class="content-container" style="padding: 70px; max-width: 1200px; margin: auto;">
  <h2 style="text-align: center; margin-bottom: 20px;">Project Status Overview</h2>
  
  <!-- Responsive container for both charts -->
  <div style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: center;">
    <!-- Bar Chart -->
    <div style="flex: 1; min-width: 300px;">
      <canvas id="barChart" style="width: 100%; max-height: 400px;"></canvas>
    </div>
    <!-- Pie Chart -->
    <div style="flex: 1; min-width: 300px;">
      <canvas id="pieChart" style="width: 100%; max-height: 400px;"></canvas>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Data preparation
    const labels = [
      {% for x in projects %}
        "{{ x.project_status }}" {% if not forloop.last %}, {% endif %}
      {% endfor %}
    ];
    const dataValues = [
      {% for x in projects %}
        {{ x.total }} {% if not forloop.last %}, {% endif %}
      {% endfor %}
    ];
    const backgroundColors = [
      'rgba(255, 99, 132, 0.6)', // Red
      'rgba(54, 162, 235, 0.6)', // Blue
      'rgba(255, 206, 86, 0.6)', // Yellow
      'rgba(75, 192, 192, 0.6)', // Green
      'rgba(153, 102, 255, 0.6)', // Purple
      'rgba(255, 159, 64, 0.6)'  // Orange
    ];
    const borderColors = [
      'rgba(255, 99, 132, 1)',
      'rgba(54, 162, 235, 1)',
      'rgba(255, 206, 86, 1)',
      'rgba(75, 192, 192, 1)',
      'rgba(153, 102, 255, 1)',
      'rgba(255, 159, 64, 1)'
    ];

    // Bar Chart
    new Chart(document.getElementById('barChart').getContext('2d'), {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: 'Number of Projects',
          data: dataValues,
          backgroundColor: backgroundColors,
          borderColor: borderColors,
          borderWidth: 1
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            display: true,
            position: 'top'
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: 'Project Status'
            }
          },
          y: {
            beginAtZero: true,
            title: {
              display: true,
              text: 'Total Projects'
            }
          }
        }
      }
    });

    // Pie Chart
    new Chart(document.getElementById('pieChart').getContext('2d'), {
      type: 'pie',
      data: {
        labels: labels,
        datasets: [{
          data: dataValues,
          backgroundColor: backgroundColors,
          borderColor: borderColors,
          borderWidth: 1
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            display: true,
            position: 'top'
          },
          title: {
            display: true,
            text: 'Project Distribution'
          }
        }
      }
    });
  });
  
</script>
</div>
</div>
</main>
{% include "footer.html" %}
