{% extends 'header.html' %}
{% block content %}
<div class="container mx-auto px-4 py-6">
    <h1 class="text-2xl font-semibold text-gray-800">{{ issue.title }}</h1>
    <p class="mt-2 text-gray-700">{{ issue.description }}</p>
    <p class="mt-2 text-gray-600"><strong>Status:</strong> {{ issue.status }}</p>
    <p class="mt-2 text-gray-600"><strong>Reported By:</strong> {{ issue.user.username }}</p>
    <p class="mt-2 text-gray-600"><strong>Created At:</strong> {{ issue.created_at }}</p>
</div>
{% endblock %}
