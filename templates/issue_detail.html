{% load static %}

<script src="https://cdn.tailwindcss.com"></script>

<!DOCTYPE html>
<html lang="id" x-data="dashboardApp()" :class="{ 'dark': darkMode }">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GovTracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="stylesheet" href="{% static 'css/dash.css' %}">

</head>
<body x-data="dashboardApp()" :class="{ 'dark': darkMode }">

<!-- MOBILE OVERLAY -->
<div class="mobile-overlay" :class="{ show: mobileSidebarOpen }" @click="mobileSidebarOpen=false"></div>

<!-- ===== SIDEBAR ===== -->
{% include "aside.html" %}

<!-- ===== HEADER ===== -->
{% include "heading.html" %}

<!-- ===== MAIN ===== -->
<main class="main" :class="{ 'sidebar-collapsed': sidebarCollapsed, 'sidebar-hidden': isMobile }">
  <div class="content">

    <!-- ============================
         PAGE: DASHBOARD
    ============================= -->



<div class="container mx-auto px-4 py-6">
    <h1 class="text-2xl font-semibold text-gray-800">{{ issue.title }}</h1>
    <p class="mt-2 text-gray-700">{{ issue.description }}</p>
    <p class="mt-2 text-gray-600"><strong>Status:</strong> {{ issue.status }}</p>
    <p class="mt-2 text-gray-600"><strong>Reported By:</strong> {{ issue.user.username }}</p>
    <p class="mt-2 text-gray-600"><strong>Created At:</strong> {{ issue.created_at }}</p>
</div>
</div></div>

</main>

{% include "footer.html" %}
