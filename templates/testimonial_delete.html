{% extends "heading.html" %}
{% block content %}
{% load static %}

<script src="https://cdn.tailwindcss.com"></script>

<!DOCTYPE html>
<html lang="id" x-data="dashboardApp()" :class="{ 'dark': darkMode }">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GovTracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="stylesheet" href="{% static 'css/dash.css' %}">

</head>
<body x-data="dashboardApp()" :class="{ 'dark': darkMode }">

<!-- MOBILE OVERLAY -->
<div class="mobile-overlay" :class="{ show: mobileSidebarOpen }" @click="mobileSidebarOpen=false"></div>

<!-- ===== SIDEBAR ===== -->
{% include "aside.html" %}

<!-- ===== HEADER ===== -->

<!-- ===== MAIN ===== -->
<main class="main" :class="{ 'sidebar-collapsed': sidebarCollapsed, 'sidebar-hidden': isMobile }">
  <div class="content">

    <!-- ============================
         PAGE: DASHBOARD
    ============================= -->

    <div class="max-w-xl mx-auto bg-white shadow-lg rounded-lg p-6 text-center">
        <h2 class="text-2xl font-bold text-gray-900">Are you sure?</h2>
        <p class="text-gray-700 mt-2">You are about to delete <strong>{{ testimonial }}</strong>. This action cannot be undone.</p>

        <div class="mt-6 flex justify-center gap-4">
            <form method="POST" action="">
                {% csrf_token %}
                <button type="submit" class="bg-red-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-red-500 transition-all shadow-md">
                    ✅ Confirm Delete
                </button>
            </form>

            <a href="{% url 'testimonials' %}" class="bg-gray-500 text-white px-6 py-2 rounded-lg font-medium hover:bg-gray-400 transition-all shadow-md">
                ❌ Cancel
            </a>
        </div>
    </div>
</div>
</main>
{% include "footer.html" %}
{% endblock %}
