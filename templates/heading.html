  {% load static %}
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="{% static 'images/GOK.png' %}">
  <title>GovTracker</title>
  <link rel="icon" href="{% static 'images/GOK.png' %}">

  <header class="header flex flex-col gap-4 p-4 md:flex-row md:items-center md:justify-between">
    <div class="flex flex-col gap-4 md:flex-row md:items-center md:gap-6">
      <button class="header-btn flex items-center justify-center" @click="toggleSidebar()" style="border:none;">
        <iconify-icon icon="solar:hamburger-menu-bold" style="font-size:20px;"></iconify-icon>
      </button>

      <div class="header-title">
        <h1 x-text="pageTitle" class="text-xl font-semibold"></h1>
        <div class="breadcrumb text-sm">GovTracker / <span x-text="pageTitle"></span></div>
      </div>
    </div>

    <nav class="flex flex-wrap items-center gap-3 text-sm">
      <a href="{% url 'index' %}" style="color:var(--text-light);font-size:16px;"><i class="fas fa-home"></i> Home</a>
      <a href="{% url 'AboutUs' %}" style="color:var(--text-light);font-size:16px;"><i class="fas fa-info-circle"></i> About Us</a>
      <a href="{% url 'testimonials' %}" style="color:var(--text-light);font-size:16px;"><i class="fas fa-comments"></i> Testimonials</a>
      <a href="{% url 'team' %}" style="color:var(--text-light);font-size:16px;"><i class="fas fa-users"></i> Team</a>
      <a href="{% url 'contactus' %}" style="color:var(--text-light);font-size:16px;"><i class="fas fa-envelope"></i> Contact Us</a>
      <a href="{% url 'feedback' %}" style="color:var(--text-light);font-size:16px;"><i class="fas fa-comment-dots"></i> Feedback</a>
      <a href="{% url 'project' %}" style="color:var(--text-light);font-size:16px;"><i class="fas fa-project-diagram"></i> Projects</a>
      
                {% if request.user.is_superuser %}
                    <a href="{% url 'adminview' %}" class="font-bold text-blue-400">
                        <i class="fas fa-user-shield"></i> Admin Dashboard
                    </a>
                {% elif request.user.is_enduser %}
                    <a href="#" class="font-bold text-green-400">
                        <i class="fas fa-user"></i> User Dashboard
                    </a>
                {% endif %}
    </nav>

    <div class="flex flex-col gap-4 md:flex-row md:items-center md:gap-4 w-full md:w-auto">
      <div class="search-bar flex items-center gap-2 rounded-lg px-3 py-2 w-full md:w-auto">
        <iconify-icon icon="solar:magnifer-bold" style="color:var(--text-light);font-size:16px;"></iconify-icon>
        <input type="text" placeholder="GovTracker..." class="w-full bg-transparent outline-none">
      </div>

      <div class="flex items-center gap-2">
        <button class="header-btn" style="border:none;">
          <iconify-icon icon="solar:bell-bold-duotone" style="font-size:20px;"></iconify-icon>
          <div class="badge">4</div>
        </button>

        <button class="header-btn" @click="darkMode=!darkMode" style="border:none;">
          <iconify-icon :icon="darkMode ? 'solar:sun-bold' : 'solar:moon-bold'" style="font-size:20px;"></iconify-icon>
        </button>

        <div class="avatar">
          <button @click="open = !open" class="flex items-center focus:outline-none">
            <img src="{{ request.user.profile.url }}?w=100&h=100&fit=crop" class="w-10 h-10 rounded-full border-2 border-gray-300 p-0.5">
          </button>
        </div>
      </div>

      <div class="datetime text-right">
        <div x-text="currentDate" class="text-sm font-medium"></div>
        <div x-text="currentTime" class="text-xs font-semibold" style="font-family:'JetBrains Mono';"></div>
      </div>
    </div>
  </header>

  {% block content %}
  {% endblock content %}
